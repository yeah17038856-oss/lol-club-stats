<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자랭 아저씨들 내전 전적</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --bg:#0a0e1a; --panel:#111829; --panel2:#172038; --line:#232e4b;
  --text:#e8ecf5; --muted:#8b96b3; --gold:#d6b25e;
  --blue:#4c8dff; --blue-bg:rgba(76,141,255,.08); --red:#ff5a6a; --red-bg:rgba(255,90,106,.08);
  --win:#3fb6a8; --lose:#e2566a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 48px}
header{padding:32px 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
header .eyebrow{color:var(--gold);font-size:12px;letter-spacing:.18em;font-weight:700}
header h1{margin:4px 0;font-size:28px;font-weight:800}
header p{margin:0;color:var(--muted);font-size:13px}
#notice{margin:12px 0;padding:10px 14px;border-radius:10px;background:#2a2410;border:1px solid #5a4a1c;color:#f0d78f;font-size:13px}
#notice:empty{display:none}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:16px}
.seg button{background:none;border:0;color:var(--muted);padding:7px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:12px;margin:10px 2px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* 챔피언 썸네일 */
.ci{border-radius:8px;flex:none;display:inline-grid;place-items:center;object-fit:cover;background:#1d2742;vertical-align:middle}
.ci.txt{color:var(--muted);font-weight:700;font-size:12px;border:1px solid var(--line)}
.ci.empty{border:1px dashed var(--line);background:none}

/* 랭킹 */
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:44px 1fr 80px 110px 64px 100px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.head{cursor:default;color:var(--muted);font-size:12px;font-weight:600;background:var(--panel2)}
.row:not(.head):hover{background:var(--panel2)}
.rank{font-weight:800;color:var(--muted);text-align:center}
.rank.top{color:var(--gold)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who .name{min-width:0;flex:0 1 auto}
.most{display:flex;gap:3px;flex:none}
.rank{font-size:16px}
.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.wr{display:flex;flex-direction:column;gap:4px;font-weight:700}
.track{height:5px;background:#26304b;border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--win)}
.dim{opacity:.5}
.dots{display:flex;gap:3px}
.dot{width:17px;height:17px;border-radius:4px;font-size:10px;font-weight:800;display:inline-grid;place-items:center;color:#0a0e1a}
.dot.w{background:var(--win)} .dot.l{background:var(--lose)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* 내전 경기 카드 */
.match{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.mh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--panel2);font-size:13px;color:var(--muted)}
.mh b{color:var(--text)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px 6px}
.score .side{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
.score .side.red{justify-content:flex-end}
.score .side.blue{color:var(--blue)} .score .side.red{color:var(--red)}
.score .kills{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.score .kills .sep{color:var(--muted);margin:0 8px;font-weight:500}
.tag{font-size:11px;padding:2px 8px;border-radius:5px;font-weight:800}
.tag.w{background:var(--win);color:#0a0e1a} .tag.l{background:#3a2430;color:var(--lose)}
.lanes{padding:6px 10px 12px}
.headline{margin:0 16px 4px;padding:8px 12px;border-radius:10px;background:rgba(214,178,94,.1);border:1px solid rgba(214,178,94,.3);font-size:13px;font-weight:600;line-height:1.45}
.dbar{height:3px;background:#26304b;border-radius:2px;margin-top:3px;overflow:hidden}
.dbar div{height:100%;background:linear-gradient(90deg,#ff8a5c,#ff5a6a)}
.ps.red .dbar{transform:scaleX(-1)}
.dbar.big{height:6px;margin:0 0 2px}
.gb{display:flex;flex-wrap:wrap;align-items:center;gap:3px;font-size:11px;line-height:1.2;margin-top:4px}
.ps.red .gb{justify-content:flex-end}
.gb .nd{margin:0}
.bg{display:inline-block;font-size:10px;font-weight:700;line-height:1.3;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.07);border:1px solid var(--line);white-space:nowrap}
.exp{display:block;width:100%;background:none;border:0;border-top:1px solid var(--line);color:var(--muted);font:inherit;font-size:12px;padding:8px;cursor:pointer}
.exp:hover{color:var(--text)}
.detail{padding:4px 12px 12px;overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.dt tr.blue td:first-child{box-shadow:inset 3px 0 0 var(--blue)} .dt tr.red td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.dt .db{min-width:90px} .dt .db span{color:var(--muted);font-size:11px}
.dt .dn{max-width:110px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.persona{margin:14px 0 4px;padding:14px;border-radius:14px;background:linear-gradient(140deg,rgba(214,178,94,.16),rgba(76,141,255,.06));border:1px solid rgba(214,178,94,.35)}
.idrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.idrow .dv{width:1px;height:16px;background:var(--line)}
.idt{font-size:16px;font-weight:800;letter-spacing:-.02em;margin-right:4px}
.nick{display:inline-flex;align-items:center;font-size:13px;font-weight:800;padding:3px 11px;line-height:1.35;border-radius:20px;color:#ffd6f0;background:linear-gradient(135deg,rgba(236,72,153,.28),rgba(168,85,247,.22));border:1px solid rgba(236,72,153,.45)}
.idrow.sm{margin-top:8px;gap:5px 6px}
.idrow.sm .dv{height:12px}
.idrow.sm .idt{font-size:12px;color:var(--gold);margin-right:2px}
.idrow.sm .nick{font-size:11px;padding:1px 8px}
.persona .pb{margin-top:8px;font-size:11px;color:var(--muted)}
.persona .pt{display:flex;gap:12px;align-items:center}
.persona .pic{font-size:30px;line-height:1}
.persona b{font-size:18px;display:block}
.persona small{color:var(--muted);font-size:12px}
.persona .pl{margin-top:12px;padding-top:12px;border-top:1px solid rgba(214,178,94,.25);font-size:13px}
.persona .pw{margin-top:2px;font-size:13px}
.titles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ttl{display:inline-flex;flex-direction:column;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700}
.ttl small{color:var(--muted);font-weight:500;font-size:11px}
.team{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px 2px 6px;border-radius:20px;border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.team i{width:8px;height:8px;border-radius:50%;background:var(--tc);flex:none}
.tlogo{width:16px;height:16px;object-fit:contain;flex:none}
.team.big .tlogo{width:18px;height:18px}
.team small{font-size:9px;color:var(--muted);font-weight:800;letter-spacing:.04em}
.team.big{font-size:13px;padding:3px 11px 3px 7px}.team.big i{width:10px;height:10px}.team.big small{font-size:10px}
.teamrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:14px}
.mtype{margin-top:8px;font-size:12px;font-weight:700;color:var(--gold)}
.banrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:2px 16px 6px}
.bans{display:flex;gap:4px;flex-wrap:wrap}
.bans.red{justify-content:flex-end}
.banlbl{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.ban{position:relative;display:inline-block;line-height:0;border-radius:6px;overflow:hidden}
.ban .ci{filter:grayscale(1);opacity:.55;border-radius:6px}
.lane-row{display:grid;grid-template-columns:1fr 54px 1fr;align-items:center;gap:6px;margin-top:4px}
.ps{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;min-width:0;cursor:pointer}
.ps.blue{background:var(--blue-bg)}
.ps.red{background:var(--red-bg);flex-direction:row-reverse;text-align:right}
.ps.win{box-shadow:inset 3px 0 0 var(--win)}
.ps.red.win{box-shadow:inset -3px 0 0 var(--win)}
.ps:hover .pn{text-decoration:underline}
.ps.none{cursor:default;min-height:52px}
.pi{min-width:0}
.cw{position:relative;display:inline-block;line-height:0;flex:none}
.star{position:absolute;top:-7px;right:-7px;font-size:15px;line-height:1;color:var(--gold);text-shadow:0 0 6px rgba(214,178,94,.9),0 0 2px #000}
.ps.red .star{right:auto;left:-7px}
.nd.mk{background:var(--lose);color:#fff}
.nd{display:inline-block;font-size:10px;font-weight:800;color:#0a0e1a;background:var(--gold);border-radius:4px;padding:0 5px;margin-left:2px;vertical-align:1px}
.pn{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk b{color:var(--text);font-weight:600}
.lane-label{text-align:center;font-size:12px;font-weight:700;color:var(--gold)}
.more{display:block;margin:12px auto;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 18px;border-radius:10px;font:inherit;cursor:pointer}

/* 멤버 (라인별) */
.lane-sec{margin-bottom:22px}
.lane-sec h2{display:flex;align-items:center;gap:8px;font-size:16px;margin:0 0 10px}
.lane-sec h2 .bar{width:4px;height:16px;border-radius:2px;background:var(--gold)}
.lane-sec h2 .cnt{color:var(--muted);font-weight:500;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.mcard:hover{border-color:var(--gold)}
.mcard .nk{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .rn{color:var(--muted);font-size:13px}
.mcard .st{margin-top:10px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.mcard .mi{display:flex;gap:4px;margin-top:10px;min-height:30px}
.pos{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:#2a2410;color:var(--gold);margin-right:4px}
.pos.sub{background:var(--panel2);color:var(--muted)}

/* 밴 탭 */
.bsec{margin-bottom:26px}
.bsec > h2{font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.bsec > p.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.hall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hcard{position:relative;background:linear-gradient(160deg,#2a1420,var(--panel) 60%);border:1px solid #5a2433;border-radius:16px;padding:16px 12px;text-align:center;overflow:hidden}
.hcard .ci{filter:grayscale(.35)}
.hcard .stamp{position:absolute;top:10px;right:-28px;transform:rotate(35deg);background:var(--lose);color:#fff;font-size:10px;font-weight:800;padding:2px 30px;letter-spacing:.08em}
.hcard b{display:block;margin-top:8px;font-size:15px}
.hcard span{color:var(--muted);font-size:12px}
.story{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.story .tx{font-size:14px;line-height:1.55}
.story .tx b{color:var(--gold)}
.story .tx small{display:block;color:var(--muted);font-size:12px}
.snipe{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.snipe:first-child{border-top:0}
.snipe:hover{background:var(--panel2)}
.snipe .cnt{font-weight:800;color:var(--lose);white-space:nowrap}
.icons{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.bc{position:relative;display:inline-block;line-height:0}
.bc.fx .ci{box-shadow:0 0 0 2px var(--gold)}
.bc i{position:absolute;right:-5px;bottom:-5px;background:var(--gold);color:#0a0e1a;font-style:normal;font-size:10px;font-weight:800;line-height:1;padding:2px 4px;border-radius:6px}
.brow{display:grid;grid-template-columns:28px 1fr 130px 110px;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow.head{color:var(--muted);font-size:12px;font-weight:600;background:var(--panel2)}
.brow .bar{height:6px;background:#26304b;border-radius:3px;overflow:hidden;margin-top:4px}
.brow .bar div{height:100%;background:var(--lose)}
.escape{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ecard{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.ecard.w{border-color:rgba(63,182,168,.5)} .ecard.l{border-color:rgba(226,86,106,.35)}
.ecard .tx{font-size:13px;line-height:1.5;min-width:0}
.ecard .tx b{font-size:14px}
.ecard .tx small{display:block;color:var(--muted)}
@media (max-width:640px){
  .brow{grid-template-columns:22px 1fr 84px 70px}
}

/* 팬덤 탭 */
.lgbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:4px 0 6px}
.lglegend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-bottom:12px}
.lglegend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.frow{display:grid;grid-template-columns:32px 40px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.fn{font-weight:800;font-size:15px}.fn small{color:var(--muted);font-size:11px;font-weight:700;margin-left:4px}
.fm{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.fm span{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.fc{font-size:12px;color:var(--muted);white-space:nowrap}.fc b{font-size:18px;color:var(--text);margin-right:2px}
.tdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--tc);justify-self:center}
.wrow{display:grid;grid-template-columns:28px 1fr 74px 56px 56px 56px;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.wrow:first-child{border-top:0}
.wrow.head{color:var(--muted);font-size:12px;font-weight:600;background:var(--panel2)}
.syn{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.scard{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.sv{margin-top:3px;font-size:13px}
@media (max-width:640px){ .wrow{grid-template-columns:24px 1fr 64px 48px} .wrow .c-kda{display:none} }

/* 상세 모달 */
#modal{position:fixed;inset:0;background:rgba(3,6,15,.72);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:10}
#modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:660px;padding:22px;position:relative}
.close{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--muted);font-size:26px;cursor:pointer}
.sheet h2{margin:0 0 2px;font-size:22px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.card{background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.card b{display:block;font-size:18px}
.card span{color:var(--muted);font-size:12px}
.sheet h3{font-size:14px;margin:18px 0 8px;color:var(--gold)}
.mini{width:100%;border-collapse:collapse;font-size:13px}
.mini td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:middle}
.mini tr:first-child td{border-top:0}
.cn{display:flex;align-items:center;gap:8px;font-weight:700}
.hexseg{margin:0 0 6px}
.hexseg button{padding:5px 12px;font-size:13px}
.hexwrap{max-width:360px;margin:6px auto 14px;padding:0 10px}
.hexwrap.few{opacity:.6}
.radar{width:100%;height:auto;display:block;overflow:visible}
.radar .rl{fill:var(--muted);font-size:11px;font-weight:600}
.radar .rv{fill:var(--text);font-size:12px;font-weight:800}
.hexsum{text-align:center;font-size:13px;line-height:1.7;margin-top:2px}
footer{margin-top:32px;color:var(--muted);font-size:11px;line-height:1.6}

@media (max-width:640px){
  .row{grid-template-columns:32px 1fr 56px 64px}
  .row .c-kda,.row .c-recent{display:none}
  .who{flex-direction:column;align-items:flex-start;gap:4px}
  .most .ci{width:20px!important;height:20px!important}
  .lane-row{grid-template-columns:1fr 34px 1fr;gap:4px}
  .ps{gap:6px;padding:5px 6px}
  .ps .ci{width:30px;height:30px}
  .dt{font-size:11px} .dt td{padding:5px 2px} .dt .dn{max-width:64px} .dt .db{min-width:58px} .dt .ci{display:none}
  .detail{padding:4px 8px 10px}
  .pn{font-size:13px}
  .lane-label{font-size:11px}
  .score .kills{font-size:18px}
  .ban .ci{width:20px!important;height:20px!important}
  .banrow{padding:2px 10px 6px;gap:4px}
  .cards{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">LEAGUE OF LEGENDS · 내전 전적</div>
    <h1 id="club"></h1>
    <p id="updated">불러오는 중…</p>
  </header>
  <div id="notice"></div>
  <div class="seg" id="tabs">
    <button data-tab="matches" class="on">최근 경기</button>
    <button data-tab="rank">랭킹</button>
    <button data-tab="bans">밴</button>
    <button data-tab="members">멤버</button>
    <button data-tab="fandom">팬덤</button>
  </div>
  <main>
    <section id="matches"></section>
    <section id="rank" hidden></section>
    <section id="bans" hidden></section>
    <section id="members" hidden></section>
    <section id="fandom" hidden></section>
  </main>
  <footer>이 사이트는 동호회 내부용 비공식 사이트이며 Riot Games가 보증하거나 후원하지 않습니다. 챔피언 이미지 및 League of Legends는 Riot Games, Inc.의 상표 또는 저작물입니다.</footer>
</div>
<div id="modal" hidden><div class="sheet"><button class="close" aria-label="닫기">×</button><div id="detail"></div></div></div>

<script>
/* ===================== 설정 (여기만 수정하세요) ===================== */

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const nkey = s => String(s ?? "").replace(/[\s.'&:]/g, "").toLowerCase();

const LANES = ["탑","정글","미드","원딜","서폿"];
function laneOf(s){
  const t = nkey(s); if (!t) return "";
  if (/^(탑|top)/.test(t)) return "탑";
  if (/^(정글|jg|jungle|jug)/.test(t)) return "정글";
  if (/^(미드|mid)/.test(t)) return "미드";
  if (/^(원딜|바텀|원|ad|bot)/.test(t)) return "원딜";
  if (/^(서폿|서포|폿|sup)/.test(t)) return "서폿";
  return String(s).trim();
}
const laneIdx = l => { const i = LANES.indexOf(l); return i < 0 ? 99 : i; };

const canon = n => ALIAS.get(nkey(n)) || n;
function loadMembers(raw){
  for (const r of raw){
    const nick = pick(r, ["닉네임","게임닉네임","nickname"]); if (!nick) continue;
    const alts = pick(r, ["다른닉네임","부캐","이전닉네임"]).split(/[,/]/).map(s => s.trim()).filter(Boolean);
    MEMBERS.set(nick, { nick,
      real: pick(r, ["실명","이름","실제이름","실제 이름","name"]),
      main: laneOf(pick(r, ["주포지션","주라인","main"])),
      sub:  laneOf(pick(r, ["부포지션","부라인","sub"])),
      team: pick(r, ["응원팀","팀","좋아하는팀"]),
      alias: pick(r, ["별명"]) });
    [nick, ...alts].forEach(a => ALIAS.set(nkey(a), nick));
    pick(r, ["저격밴","시그니처","저격밴챔피언"]).split(/[,/·]/).map(x => x.trim()).filter(Boolean)
      .forEach(c => TARGET.set(ck(c), { nick, name: c }));
  }
}

}

const H = {

const ST = {   // 통계 열 (없으면 비워도 됨)
  time:["게임시간","시간"], gold:["골드","골드획득"], cs:["cs","미니언"], neutral:["중립","중립미니언"], cc:["cc","군중제어"],
  dmg:["챔피언피해","딜량"], tower:["포탑피해"], obj:["목표물피해","오브젝트피해"], taken:["받은피해"], mitig:["피해감소"],
  vision:["시야","시야점수"], wPlace:["와드설치"], wKill:["와드파괴"], ctrl:["제어와드"], fb:["선취점"], multi:["다중킬","최대다중킬"]
};
function gameMinutes(v){
  v = String(v || "").trim(); if (!v) return null;
  if (/^\d+(\.\d+)?$/.test(v)){ const x = parseFloat(v); return x < 5 ? x * 24 * 60 / 60 : x; }   // 시트가 시간으로 바꾼 경우 대비
  const p = v.split(":").map(Number); if (p.some(isNaN)) return null;
  return p.length >= 2 ? p[0] + p[1] / 60 : null;
}
function readStats(r){
  const o = {}; for (const [k, keys] of Object.entries(ST)) o[k] = pick(r, keys);
  const min = gameMinutes(o.time); if (!min || o.dmg === "") return null;
  const n = k => parseFloat(String(o[k]).replace(/,/g, "")) || 0;
  return { min, gold:n("gold"), cs:n("cs"), neutral:n("neutral"), cc:n("cc"), dmg:n("dmg"), tower:n("tower"), obj:n("obj"),
    taken:n("taken"), mitig:n("mitig"), vision:n("vision"), wPlace:n("wPlace"), wKill:n("wKill"), ctrl:n("ctrl"),
    fb: /^(o|y|1|true|선취|✓|v)/i.test(String(o.fb).trim()), multi:n("multi") };
}
function normalize(raw){
  const out = [];
  for (const r of raw){
    const rawName = pick(r, H.name); if (!rawName) continue;
    const res = pick(r, H.result).toLowerCase();
    const win = ["승","승리","w","win","o"].includes(res) ? true : ["패","패배","l","lose","loss","x"].includes(res) ? false : null;
    if (win === null) continue;
    if (/자랭|자유|랭크|flex/i.test(pick(r, H.type))) continue;   // 내전만 집계
    const dRaw = pick(r, H.date), dm = dRaw.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    const date = dm ? `${dm[1]}-${dm[2].padStart(2,"0")}-${dm[3].padStart(2,"0")}` : dRaw;   // 2026. 11. 8 같은 형식도 통일
    const t = pick(r, H.team).toLowerCase();
    const k = num(pick(r, H.k)), d = num(pick(r, H.d)), a = num(pick(r, H.a));
    out.push({ date, game: pick(r, H.game) || date, win, name: canon(rawName),
      team: (t.startsWith("레") || t.startsWith("r")) ? "레드" : "블루",
      lane: laneOf(pick(r, H.lane)), champ: pick(r, H.champ), k, d, a,
      hasKda: k !== null && d !== null && a !== null,
      bans: pick(r, H.ban).split(/[,/·]/).map(x => x.trim()).filter(Boolean),
      st: readStats(r) });
  }
  return out;
}
const byRecent = (a, b) => b.date.localeCompare(a.date) || b.game.localeCompare(a.game, undefined, {numeric:true});
const kdaText = (k, d, a) => d === 0 ? "Perfect" : ((k + a) / d).toFixed(2);
function bump(map, key, win, r){
  const e = map.get(key) || {key, g:0, w:0, k:0, d:0, a:0, kg:0};
  e.g++; if (win) e.w++;
  if (r && r.hasKda){ e.k += r.k; e.d += r.d; e.a += r.a; e.kg++; }
  map.set(key, e);
}
function playerStats(rows){
  const m = new Map();
  for (const r of rows){
    let p = m.get(r.name);
    if (!p){ p = {name:r.name, games:0, wins:0, k:0, d:0, a:0, kdaGames:0, champs:new Map(), lanes:new Map(), hist:[]}; m.set(r.name, p); }
    p.games++; if (r.win) p.wins++;
    if (r.hasKda){ p.k += r.k; p.d += r.d; p.a += r.a; p.kdaGames++; }
    if (r.champ) bump(p.champs, r.champ, r.win, r);
    if (r.lane) bump(p.lanes, r.lane, r.win, r);
    p.hist.push(r);
  }
  for (const p of m.values()){
    p.hist.sort(byRecent);
    p.wr = p.wins / p.games;
    p.champList = [...p.champs.values()].sort((a,b) => b.g - a.g || b.w - a.w);
    p.most = p.champList[0]?.key || "";
    let s = 0; for (const h of p.hist){ if (h.win === p.hist[0].win) s++; else break; }
    p.streak = p.hist.length ? s + (p.hist[0].win ? "연승" : "연패") : "";
  }
  return [...m.values()];
}
function groupGames(rows){
  const m = new Map();
  for (const r of rows){
    let g = m.get(r.game);
    if (!g){ g = {id:r.game, game:r.game, date:r.date, blue:[], red:[], blueBans:[], redBans:[]}; m.set(r.game, g); }
    (r.team === "레드" ? g.red : g.blue).push(r);
    const bl = r.team === "레드" ? g.redBans : g.blueBans;
    r.bans.forEach(b => { if (!bl.includes(b)) bl.push(b); });
  }
  const sortTeam = t => t.map((r, i) => [r, i]).sort((x, y) => laneIdx(x[0].lane) - laneIdx(y[0].lane) || x[1] - y[1]).map(x => x[0]);
  for (const g of m.values()){ g.blue = sortTeam(g.blue); g.red = sortTeam(g.red); }
  return [...m.values()].sort(byRecent);
}

      <td class="num">${kp ? pct((r.k + r.a) / kp) : "–"}</td></tr>`; };

/* ---------- 밴 분석 ---------- */
function banAnalysis(){
  const games = groupGames(ALL).slice().reverse();            // 오래된 경기부터
  const laneCnt = new Map();
  for (const r of ALL){ if (!r.champ || !r.lane) continue; const m = laneCnt.get(ck(r.champ)) || new Map(); m.set(r.lane, (m.get(r.lane) || 0) + 1); laneCnt.set(ck(r.champ), m); }
  const champLane = new Map([...laneCnt].map(([k, m]) => [k, [...m].sort((a,b) => b[1] - a[1])[0][0]]));
  const banned = games.filter(g => g.blueBans.length || g.redBans.length);
  const C = new Map();
  const getC = name => { const k = ck(name); if (!C.has(k)) C.set(k, {key:k, name, bans:0, banWins:0, picks:[], bannedIn:new Set()}); return C.get(k); };
  const seen = new Map();      // 멤버 -> Map(챔피언키 -> 마지막으로 그 챔피언을 한 경기 기록)
  const played = new Map();    // 멤버 -> Map(챔피언키 -> 지금까지 한 횟수)
  const snipes = new Map();    // 멤버 -> Map(챔피언키 -> {name, n, origin})
  const teamBans = new Map();  // 멤버 -> Map(챔피언키 -> {name, n})  (내 팀이 한 밴)
  for (const g of games){
    const blueWin = g.blue[0]?.win ?? !g.red[0]?.win;
    for (const [bans, win, mine] of [[g.blueBans, blueWin, g.blue], [g.redBans, !blueWin, g.red]]){
      for (const b of bans){
        const e = getC(b); e.bans++; if (win) e.banWins++; e.bannedIn.add(g.id);
        for (const r of mine){ const m = teamBans.get(r.name) || new Map(); const t = m.get(ck(b)) || {name:b, n:0}; t.n++; m.set(ck(b), t); teamBans.set(r.name, m); }
      }
    }
    // 저격 밴: 상대 팀의 밴 하나하나를 '누구를 막으려던 밴인지' 한 명에게 배정
    //  1) 멤버 시트 '저격밴' 열에 지정된 챔피언이면 그 사람 (그 판에 상대 팀에 있을 때)
    //  2) 아니면 그 챔피언의 주 라인을 보고, 그 판 상대 팀에서 같은 라인에 선 사람 (라인 추정)
    for (const [team, oppBans] of [[g.blue, g.redBans], [g.red, g.blueBans]]){
      for (const b of oppBans){
        const k = ck(b), fixed = TARGET.get(k);
        let target = null, how = "";
        if (fixed){ if (team.some(r => r.name === fixed.nick)){ target = fixed.nick; how = "지정"; } }
        else {
          const lane = champLane.get(k) || LANE_OF.get(k);
          const r = lane && team.find(x => x.lane === lane);
          if (r){ target = r.name; how = "추정"; }
        }
        if (!target) continue;
        { const e = getC(b); e.targets = e.targets || new Map(); e.targets.set(target, (e.targets.get(target) || 0) + 1); }
        const m = snipes.get(target) || new Map();
        const t = m.get(k) || { name: b, n: 0, how, origin: seen.get(target)?.get(k) };
        t.n++; m.set(k, t); snipes.set(target, m);
      }
    }
    for (const r of [...g.blue, ...g.red]){
      if (!r.champ) continue;
      getC(r.champ).picks.push(r);
      const m = seen.get(r.name) || new Map(); m.set(ck(r.champ), r); seen.set(r.name, m);
      const pc = played.get(r.name) || new Map(); pc.set(ck(r.champ), (pc.get(ck(r.champ)) || 0) + 1); played.set(r.name, pc);
    }
  }
  return { N: banned.length, champs: [...C.values()].filter(c => c.bans).map(c => (c.g = c.bannedIn.size, c)).sort((a,b) => b.g - a.g || b.bans - a.bans || b.picks.length - a.picks.length), snipes, teamBans, C };
}

    ${stories.map(({p, t}) => `<div class="story">${champImg(t.name, 52)}<div class="tx"><b>${esc(dispName(p.name))}</b>의 ${esc(t.name)}, 상대가 <b>${t.n}번</b> 밴했어요.
      <small>${t.how === "지정" ? "공인 저격 밴 · 아예 꺼내지도 못하게 막는 중" : `맞라인 저격 · ${t.origin ? `본인도 ${esc(t.origin.date)}에 ${kda(t.origin)} ${t.origin.win ? "승리한 챔피언" : "해본 챔피언"}` : "라인전부터 막고 들어가는 밴"}`}</small></div></div>`).join("")}
    <div class="list" style="margin-top:12px">${sn.map((p, i) => `<div class="snipe" data-p="${esc(p.name)}">

      <div class="cnt">견제 ${p.total}회</div></div>`).join("")}</div>
  </div>` : "";

  // 3) 밴 랭킹
  const rank = `<div class="bsec">

/* ---------- 라인별 6각형 지표 ---------- */
const AX = {   // id: [이름, 값 계산(r, 팀킬), 낮을수록 좋은가]
  dmg:   ["딜량",     (r) => r.st.dmg / r.st.min],
  tank:  ["탱킹",     (r) => (r.st.taken + r.st.mitig) / r.st.min],
  farm:  ["파밍",     (r) => (r.st.cs + r.st.neutral) / r.st.min],
  tower: ["포탑 압박", (r) => r.st.tower / r.st.min],
  kp:    ["킬 관여",   (r, tk) => tk ? (r.k + r.a) / tk : 0],
  live:  ["생존",     (r) => r.d / r.st.min, true],
  obj:   ["오브젝트",  (r) => r.st.obj / r.st.min],
  jg:    ["정글 파밍", (r) => r.st.neutral / r.st.min],
  vision:["시야",     (r) => r.st.vision / r.st.min],
  eff:   ["딜 효율",   (r) => r.st.gold ? r.st.dmg / r.st.gold : 0],
  cc:    ["CC",       (r) => r.st.cc / r.st.min],
  wkill: ["와드 파괴", (r) => r.st.wKill / r.st.min],
  ctrl:  ["제어 와드", (r) => r.st.ctrl / r.st.min],
};
const LANE_AX = {
  탑:   ["dmg","tank","farm","tower","kp","live"],
  정글: ["kp","obj","jg","vision","dmg","live"],
  미드: ["dmg","kp","farm","eff","cc","live"],
  원딜: ["dmg","eff","farm","tower","kp","live"],
  서폿: ["kp","vision","wkill","ctrl","cc","live"],
};
let _HX = null;
function hexData(){
  if (_HX) return _HX;
  const teamK = new Map();
  for (const g of groupGames(ALL)) for (const t of [g.blue, g.red]){ const k = t.reduce((s, r) => s + (r.k || 0), 0); t.forEach(r => teamK.set(r, k)); }
  const rows = ALL.filter(r => r.st && r.hasKda && LANE_AX[r.lane]);
  const val = (r, a) => AX[a][1](r, teamK.get(r));
  const dist = {};   // 라인 -> 축 -> {mean, sd}
  for (const l of Object.keys(LANE_AX)){
    const lr = rows.filter(r => r.lane === l); dist[l] = {};
    for (const a of LANE_AX[l]){
      const v = lr.map(r => val(r, a)), m = v.length ? v.reduce((s, x) => s + x, 0) / v.length : 0;
      const sd = v.length > 1 ? Math.sqrt(v.reduce((s, x) => s + (x - m) ** 2, 0) / v.length) : 0;
      dist[l][a] = { mean: m, sd: sd || Math.abs(m) * 0.25 || 1 };
    }
  }
  const z = (r, a) => { const d = dist[r.lane][a]; const x = (val(r, a) - d.mean) / d.sd; return AX[a][2] ? -x : x; };
  const clamp = x => Math.max(3, Math.min(99, x));
  const score = (r, a) => clamp(50 + 20 * z(r, a));                       // 한 판 기준 점수
  const gameScore = r => LANE_AX[r.lane].reduce((s, a) => s + score(r, a), 0) / 6;   // 한 판 종합
  const player = (name, lane) => {                                          // 사람별 라인 6각형
    const lr = rows.filter(r => r.name === name && r.lane === lane); if (!lr.length) return null;
    const ax = LANE_AX[lane];
    const sc = ax.map(a => clamp(50 + 30 * lr.reduce((s, r) => s + z(r, a), 0) / lr.length));
    return { lane, n: lr.length, ax, sc, total: Math.round(sc.reduce((s, v) => s + v, 0) / 6) };
  };
  return (_HX = { rows, val, score, gameScore, player, teamK });
}
function radarSVG(axes, scores, raw){
  const S = 260, c = S / 2, R = 96, n = axes.length;
  // 점수는 대부분 30~70점이라, 가운데를 비우고(12%) 90점을 바깥 끝으로 잡아 모양이 크게 보이게 함
  const f = v => v > 100 ? v / 100 : 0.12 + 0.88 * Math.min(v, 90) / 90;
  const pt = (i, v) => { const t = -Math.PI / 2 + i * 2 * Math.PI / n, k = R * f(v); return [c + Math.cos(t) * k, c + Math.sin(t) * k]; };
  const ring = v => axes.map((_, i) => pt(i, v).join(",")).join(" ");
  const poly = scores.map((v, i) => pt(i, v).join(",")).join(" ");
  return `<svg viewBox="0 0 ${S} ${S}" class="radar" role="img" aria-label="지표 6각형">
    ${[25, 75, 90].map(v => `<polygon points="${ring(v)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("")}
    <polygon points="${ring(50)}" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
    ${axes.map((_, i) => `<line x1="${c}" y1="${c}" x2="${pt(i, 90)[0]}" y2="${pt(i, 90)[1]}" stroke="var(--line)"/>`).join("")}
    <polygon points="${poly}" fill="rgba(214,178,94,.28)" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/>
    ${scores.map((v, i) => `<circle cx="${pt(i, v)[0]}" cy="${pt(i, v)[1]}" r="3" fill="var(--gold)"/>`).join("")}
    ${axes.map((a, i) => { const [x, y] = pt(i, 122); const anc = Math.abs(x - c) < 4 ? "middle" : x > c ? "start" : "end";
      return `<text x="${x}" y="${y - 3}" text-anchor="${anc}" class="rl">${AX[a][0]}</text><text x="${x}" y="${y + 11}" text-anchor="${anc}" class="rv">${Math.round(scores[i])}</text>`; }).join("")}
  </svg>`;
}
function playerLanes(name){
  const H = hexData(); const mine = H.rows.filter(r => r.name === name);
  return [...new Set(mine.map(r => r.lane))].sort((a,b) => mine.filter(r => r.lane === b).length - mine.filter(r => r.lane === a).length).map(l => H.player(name, l));
}
function hexSection(name){
  const P = playerLanes(name);
  if (!P.length) return `<h3>지표 6각형</h3><p class="muted" style="font-size:13px">통계가 입력된 경기가 아직 없어요.</p>`;
  const panel = (h, i) => {
    const [best, best2] = h.ax.map((a, i) => [a, h.sc[i]]).sort((x, y) => y[1] - x[1]).map(x => x[0]);
    return `<div class="hexp" data-lane="${h.lane}" ${i ? "hidden" : ""}>
      <div class="hexwrap ${h.n < 3 ? "few" : ""}">${radarSVG(h.ax, h.sc)}</div>
      <div class="hexsum"><b>${h.lane} 종합 ${h.total}점</b> <span class="muted">· ${h.n}판 기준${h.n < 3 ? " (표본이 적어 참고용)" : ""}</span><br>
        강점 <b style="color:var(--win)">${AX[best][0]}</b> · <b style="color:var(--win)">${AX[best2][0]}</b></div>
    </div>`;
  };
  return `<h3>지표 6각형</h3>
    ${P.length > 1 ? `<div class="seg hexseg">${P.map((h, i) => `<button data-hl="${h.lane}" class="${i ? "" : "on"}">${h.lane}</button>`).join("")}</div>` : ""}
    ${P.map(panel).join("")}
    <p class="hint" style="margin-top:4px">점선 = 같은 라인 동호회 평균(50점). 같은 라인 사람들과 비교해 잘할수록 바깥으로 커져요.</p>`;
}

  cc:"스킬로 잘 묶어요", wkill:"상대 와드도 잘 지워요", ctrl:"제어 와드에 돈을 아끼지 않아요" };

function persona(name){
  const h = playerLanes(name)[0]; if (!h) return null;
  const o = h.ax.map((a, i) => [a, h.sc[i]]).sort((x, y) => y[1] - x[1]);

  return { icon, label, lane: h.lane, n: h.n,
    line: `${h.lane} ${AX[top[0]][0]} ${Math.round(top[1])}점이 무기. ${PLUS[second[0]]}.`,
    weak: `${PLUS[third[0]]}.` };   // 장점 위주로만 표시
}

/* ---------- 칭호 ---------- */
let _TT = null;
function titles(){
  if (_TT) return _TT;
  const T = new Map(); const add = (n, t) => { if (!T.has(n)) T.set(n, []); T.get(n).push(t); };
  const ps = playerStats(ALL), games = groupGames(ALL);
  const top = (list, f, min, make) => { const m = Math.max(...list.map(f)); if (m >= min) list.filter(x => f(x) === m).forEach(x => add(x.name, make(m, x))); };
  top(ps, p => p.hist.filter(h => h.hasKda && h.d === 0).length, 1, m => ["🧟", "불사신", `노데스 ${m}회`]);
  top(ps, p => p.hist.filter(h => h.st?.fb).length, 2, m => ["🩸", "선취점 사냥꾼", `선취점 ${m}회`]);
  { const el = ps.filter(p => p.games >= 4), m = Math.max(0, ...el.map(p => p.champs.size)), w = el.filter(p => p.champs.size === m);
    if (m >= 4 && w.length <= 2) w.forEach(p => add(p.name, ["🎭", "챔프폭 바다", `${m}가지 챔피언`])); }
  ps.forEach(p => { const c = p.champList[0]; if (c && c.g >= 3) add(p.name, ["🔂", "원챔러", `${c.key} ${c.g}판`]); });
  // 억울한 캐리: 진 판에서 팀 딜 1등
  const carry = new Map();
  games.forEach(g => [g.blue, g.red].forEach(t => { if (t[0]?.win || !t.every(r => r.st)) return;
    const b = t.reduce((x, y) => y.st.dmg > x.st.dmg ? y : x); carry.set(b.name, (carry.get(b.name) || 0) + 1); }));
  top([...carry].map(([name, n]) => ({ name, n })), x => x.n, 2, m => ["😤", "억울한 캐리", `진 판 딜 1등 ${m}회`]);
  // 환상의 짝꿍: 같은 팀 3판 이상 중 승률 최고
  const duo = new Map();
  games.forEach(g => [g.blue, g.red].forEach(t => { for (let i = 0; i < t.length; i++) for (let j = i + 1; j < t.length; j++){
    const k = [t[i].name, t[j].name].sort().join("|"); const e = duo.get(k) || { g: 0, w: 0 }; e.g++; if (t[i].win) e.w++; duo.set(k, e); } }));
  const best = [...duo].filter(([, e]) => e.g >= 3).sort((a, b) => (2 * b[1].w - b[1].g) - (2 * a[1].w - a[1].g) || b[1].w / b[1].g - a[1].w / a[1].g)[0];   // 승-패 차이 큰 순
  if (best && best[1].w / best[1].g >= 0.7){ const [a, b] = best[0].split("|"), t = `${best[1].w}승 ${best[1].g - best[1].w}패`;
    add(a, ["💞", "환상의 짝꿍", `with ${dispName(b)} · ${t}`]); add(b, ["💞", "환상의 짝꿍", `with ${dispName(a)} · ${t}`]); }
  ps.forEach(p => { if (p.hist[0]?.win){ let s = 0; for (const h of p.hist){ if (h.win) s++; else break; } if (s >= 3) add(p.name, ["🔥", "연승 머신", `${s}연승 중`]); } });
  return (_TT = T);
}

/* ---------- 경기별 배지 · 헤드라인 ---------- */
const GB = [   // 경기 내 1등 배지 (라인과 관계없이 받을 수 있는 것만)
  ["💥", "딜왕", r => r.st.dmg],
];
function gameBadges(g){
  const all = [...g.blue, ...g.red].filter(r => r.st); const m = new Map();
  if (all.length < 6) return m;
  for (const [ic, lb, f] of GB){ const top = all.reduce((x, y) => f(y) > f(x) ? y : x); if (f(top) > 0){ if (!m.has(top)) m.set(top, []); m.get(top).push([ic, lb]); } }
  return m;
}
function headline(g){
  const all = [...g.blue, ...g.red].filter(r => r.st); if (all.length < 6) return "";
  const N = r => esc(dispName(r.name)), C = r => esc(r.champ);
  const mk = all.filter(r => r.st.multi >= 4).sort((a, b) => b.st.multi - a.st.multi)[0];
  if (mk) return `${mk.st.multi >= 5 ? "🏆 펜타킬!" : "🔥 쿼드라킬!"} ${N(mk)}의 ${C(mk)}가 혼자 ${mk.st.multi}명을 쓸어 담았다`;
  // 그 판 안에서 1등 ÷ 2등 격차를 항목별 '평소 격차(고정값)'로 나눠, 평소보다 가장 압도적인 기록을 고름
  // 기준값이 고정이라 다른 경기가 쌓여도 지난 헤드라인은 바뀌지 않아요.
  // 포탑은 몇 명만 쌓는 항목이라 격차가 쉽게 커져서 기준을 높게 잡음
  const fm = n => n.toLocaleString(), cands = [];
  const gap = (base, f, make) => { const v = all.map(r => [r, f(r)]).sort((a, b) => b[1] - a[1]); if (v[0][1] > 0) cands.push([v[0][1] / Math.max(v[1][1], 1) / base, make(v[0][0])]); };
  gap(1.6,  r => r.st.cc, r => `🪝 ${C(r)} CC ${fm(r.st.cc)}, ${N(r)}가 상대를 꽁꽁 묶었다`);
  gap(1.12, r => r.st.dmg, r => `💥 ${N(r)}의 ${C(r)}, 챔피언 피해 ${fm(r.st.dmg)}로 딜 폭격`);
  gap(1.15, r => r.st.vision, r => `👁️ ${N(r)} 시야 점수 ${fm(r.st.vision)}, 맵이 훤히 보였다`);
  gap(2.2,  r => r.st.tower, r => `🏰 ${C(r)} 포탑 피해 ${fm(r.st.tower)}, ${N(r)} 철거 완료`);
  gap(1.13, r => r.st.taken + r.st.mitig, r => `🛡️ ${N(r)}의 ${C(r)}, 받아낸 피해 ${fm(r.st.taken + r.st.mitig)}로 인간 방패`);
  gap(1.55, r => r.st.obj, r => `🐉 ${N(r)} 오브젝트 피해 ${fm(r.st.obj)}, 용·전령은 내 거`);
  gap(1.5,  r => r.k, r => `⚔️ ${N(r)}의 ${C(r)} ${r.k}킬, 오늘의 킬러`);
  for (const r of all) if (r.d === 0 && r.k + r.a >= 10) cands.push([1.15, `🧟 ${N(r)}의 ${C(r)} ${r.k}/0/${r.a}, 한 번도 안 죽었다`]);
  return cands.sort((a, b) => b[0] - a[0])[0][1];
}

        ["에드워드 게이밍","#6C7A96","1631819297476_edg-2021-worlds.png"],["LNG e스포츠","#2E7DF6","1717487697003_LNGlogo.png"]],
  LEC: [["G2 e스포츠","#ED1C24","G2-FullonDark.png"],["프나틱","#FF5900","1631819669150_fnc-2021-worlds.png"],
        ["모비스타 KOI","#7F5BFF","1734012609283_MKOI_FullColor_Blue.png"],["카민 코프","#2D6BFF","1704714951336_KC.png"],
        ["팀 바이탈리티","#F5D300","1675865863968_Vitality_FullColor.png"]],
  LCS: [["클라우드9","#2AA7E2","1736924120254_C9Kia_IconBlue_Transparent_2000x2000.png"],["팀 리퀴드","#3D7DD8","1769357207762_TLAlienware_Minimal_Bug-White.png"],
        ["플라이퀘스트","#2FB85A","flyquest-new-on-dark.png"],["LYON","#E0474C","1743717443673_isotypelyon-03.png"]],
};
const logoUrl = f => f ? `https://am-a.akamaihd.net/image?resize=96:&f=${encodeURIComponent("http://static.lolesports.com/teams/" + f)}` : "";
const TEAM_OF = new Map(Object.entries(TEAMS).flatMap(([lg, l]) => l.map(([n, c, f]) => [nkey(n), { name: n, color: c, league: lg, logo: logoUrl(f) }])));
const teamOf = n => { const raw = MEMBERS.get(n)?.team; if (!raw) return null; return TEAM_OF.get(nkey(raw)) || { name: raw, color: "#8b96b3", league: "" }; };
const teamChip = (t, big) => t ? `<span class="team ${big ? "big" : ""}" style="--tc:${t.color}">${t.logo ? `<img class="tlogo" src="${t.logo}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('i')))">` : "<i></i>"}${t.league ? `<small>${t.league}</small>` : ""}${esc(t.name)}</span>` : "";
function teamSection(name){
  const t = teamOf(name);
  return t ? `<div class="teamrow">❤️ ${teamChip(t, true)}</div>` : "";
}

/* ---------- 팬덤 탭 ---------- */
function renderFandom(){
  const fans = new Map();   // 팀 이름 -> {t, members:[]}
  for (const n of MEMBERS.keys()){ const t = teamOf(n); if (!t) continue;
    if (!fans.has(t.name)) fans.set(t.name, { t, members: [] }); fans.get(t.name).members.push(n); }
  if (!fans.size){ $("#fandom").innerHTML = `<div class="list"><div class="empty">아직 응원팀 데이터가 없어요.<br><span style="font-size:12px">멤버 탭 시트의 '응원팀' 열이 채워지면 여기에 나와요.</span></div></div>`; return; }
  const ps = new Map(playerStats(ALL).map(p => [p.name, p]));
  const list = [...fans.values()].sort((a, b) => b.members.length - a.members.length || a.t.name.localeCompare(b.t.name));
  const total = list.reduce((s, f) => s + f.members.length, 0);
  const LC = { LCK: "#d6b25e", LPL: "#e2566a", LEC: "#4c8dff", LCS: "#3fb6a8", "": "#8b96b3" };
  const lg = {}; list.forEach(f => lg[f.t.league || ""] = (lg[f.t.league || ""] || 0) + f.members.length);
  const lgs = Object.entries(lg).sort((a, b) => b[1] - a[1]);
  const logo = (t, sz) => t.logo ? `<img class="tlogo" src="${t.logo}" alt="" style="width:${sz}px;height:${sz}px" onerror="this.style.visibility='hidden'">` : `<i class="tdot" style="--tc:${t.color}"></i>`;

  // ① 팬덤 순위
  const rank = `<div class="bsec">
    <h2>📣 팬덤 순위</h2>
    <p class="sub">우리 동호회 ${total}명이 응원하는 팀이에요.</p>
    <div class="lgbar">${lgs.map(([l, n]) => `<div style="flex:${n};background:${LC[l] || LC[""]}"></div>`).join("")}</div>
    <div class="lglegend">${lgs.map(([l, n]) => `<span><i style="background:${LC[l] || LC[""]}"></i>${l || "기타"} ${pct(n / total)}</span>`).join("")}</div>
    <div class="list">${list.map((f, i) => `<div class="frow">
      <div class="rank ${i < 3 ? "top" : ""}">${i + 1}</div>
      ${logo(f.t, 36)}
      <div class="fi"><div class="fn">${esc(f.t.name)} <small>${f.t.league}</small></div>
        <div class="fm">${f.members.map(n => `<span data-p="${esc(n)}">${esc(dispName(n))}</span>`).join("")}</div></div>
      <div class="fc"><b>${f.members.length}</b>명</div></div>`).join("")}</div>
  </div>`;

  // ② 팬덤 대항전 (팬 2명 이상)
  const war = list.filter(f => f.members.length >= 2).map(f => {
    const st = f.members.map(n => ps.get(n)).filter(Boolean);
    const g = st.reduce((s, p) => s + p.games, 0), w = st.reduce((s, p) => s + p.wins, 0);
    const k = st.reduce((s, p) => s + p.k, 0), d = st.reduce((s, p) => s + p.d, 0), a = st.reduce((s, p) => s + p.a, 0);
    const nd = st.reduce((s, p) => s + p.hist.filter(h => h.hasKda && h.d === 0).length, 0);
    return { f, g, w, kda: g ? kdaText(k, d, a) : "–", nd };
  }).filter(x => x.g).sort((a, b) => b.w / b.g - a.w / a.g || b.g - a.g);
  const warHtml = `<div class="bsec">
    <h2>⚔️ 팬덤 대항전</h2>
    <p class="sub">같은 팀을 응원하는 사람들의 내전 기록을 합친 순위예요. 팬이 2명 이상인 팀만 참가해요.</p>
    ${war.length ? `${war[0] ? `<div class="story">${logo(war[0].f.t, 44)}<div class="tx">내전 최강 팬덤은 <b>${esc(war[0].f.t.name)} 팬클럽</b>!<small>팬 ${war[0].f.members.length}명 · ${war[0].w}승 ${war[0].g - war[0].w}패 · 승률 ${pct(war[0].w / war[0].g)}</small></div></div>` : ""}
      <div class="list">
        <div class="wrow head"><div>#</div><div>팬덤</div><div class="num">전적</div><div class="num">승률</div><div class="num c-kda">KDA</div><div class="num c-kda">노데스</div></div>
        ${war.map((x, i) => `<div class="wrow"><div class="rank ${i < 3 ? "top" : ""}">${i + 1}</div>
          <div class="cn">${logo(x.f.t, 26)}${esc(x.f.t.name)} <span class="muted" style="font-weight:500;font-size:12px">${x.f.members.length}명</span></div>
          <div class="num">${x.w}승 ${x.g - x.w}패</div><div class="num"><b>${pct(x.w / x.g)}</b></div>
          <div class="num c-kda">${x.kda}</div><div class="num c-kda">${x.nd}회</div></div>`).join("")}
      </div>` : `<div class="list"><div class="empty">팬이 2명 이상인 팀이 생기면 대항전이 열려요.</div></div>`}
  </div>`;

  // ⑥ 팬심 시너지: 같은 팀 팬끼리 같은 편이 된 판
  const syn = new Map();
  for (const g of groupGames(ALL)) for (const side of [g.blue, g.red]){
    const by = new Map();
    side.forEach(r => { const t = teamOf(r.name); if (t){ if (!by.has(t.name)) by.set(t.name, []); by.get(t.name).push(r); } });
    for (const [tn, rs] of by){ if (rs.length < 2) continue;
      const e = syn.get(tn) || { g: 0, w: 0, best: 0 }; e.g++; if (rs[0].win) e.w++; e.best = Math.max(e.best, rs.length); syn.set(tn, e); }
  }
  const synList = [...syn].map(([tn, e]) => ({ f: fans.get(tn), ...e })).sort((a, b) => b.w / b.g - a.w / a.g || b.g - a.g);
  const synHtml = `<div class="bsec">
    <h2>🤝 팬심 시너지</h2>
    <p class="sub">같은 팀 팬끼리 같은 편이 됐을 때의 승률이에요.</p>
    ${synList.length ? `<div class="syn">${synList.map(x => `<div class="scard">${logo(x.f.t, 40)}
      <div><b>${esc(x.f.t.name)} 팬끼리 뭉치면</b><div class="sv">승률 <b style="color:${x.w / x.g >= 0.5 ? "var(--win)" : "var(--lose)"}">${pct(x.w / x.g)}</b> <span class="muted">${x.w}승 ${x.g - x.w}패${x.best >= 3 ? ` · 최대 ${x.best}명 동반` : ""}</span></div></div></div>`).join("")}</div>`
      : `<div class="list"><div class="empty">아직 같은 팀 팬끼리 같은 편이 된 판이 없어요.</div></div>`}
  </div>`;

  $("#fandom").innerHTML = rank + warHtml + synHtml;
}

/* ---------- 개인 상세 ---------- */
function openPlayer(name){
  const m = MEMBERS.get(name);
  const p = playerStats(ALL).find(x => x.name === name);
  const pe = persona(name), tt = titles().get(name) || [];
  const head = `<h2 style="margin-bottom:8px">${esc(dispName(name))}</h2>${laneTags(p, m)}
    ${pe || idRow(name) ? `<div class="persona">${idRow(name)}
      ${pe ? `<div class="pl">${pe.line}</div><div class="pw">${pe.weak}</div><div class="pb">${pe.lane} ${pe.n}판 기준 성향</div>` : ""}</div>` : ""}
    ${tt.length ? `<div class="titles">${tt.map(([ic, lb, ds]) => `<span class="ttl" title="${esc(ds)}">${ic} ${lb}<small>${esc(ds)}</small></span>`).join("")}</div>` : ""}`;
  if (!p){ $("#detail").innerHTML = head + `<p class="muted" style="margin-top:16px">아직 내전 기록이 없어요.</p>`; $("#modal").hidden = false; return; }

  const mates = new Map();
  for (const g of groupGames(ALL)) for (const side of [g.blue, g.red]){
    const me = side.find(r => r.name === name); if (!me) continue;
    side.forEach(r => { if (r.name !== name) bump(mates, r.name, me.win); });
  }
  const duo = [...mates.values()].filter(e => e.g >= 2).sort((a,b) => (b.w/b.g - a.w/a.g) || b.g - a.g).slice(0, 6);
  const tbl = (list, empty) => list.length ? `<table class="mini">${list.map(e => `<tr><td><b>${esc(e.key)}</b></td><td class="num muted">${e.g}판</td><td class="num">${e.w}승 ${e.g-e.w}패</td><td class="num"><b>${pct(e.w/e.g)}</b></td></tr>`).join("")}</table>` : `<p class="muted" style="font-size:13px">${empty}</p>`;
  const champTbl = p.champList.length ? `<table class="mini">
      <tr class="muted"><td>챔피언</td><td class="num">판수</td><td class="num">전적</td><td class="num">승률</td><td class="num">평균 KDA</td></tr>
      ${p.champList.map(e => `<tr><td><div class="cn">${champImg(e.key, 30)}${esc(e.key)}</div></td><td class="num muted">${e.g}</td><td class="num">${e.w}승 ${e.g-e.w}패</td><td class="num"><b>${pct(e.w/e.g)}</b></td><td class="num">${e.kg ? `${(e.k/e.kg).toFixed(1)}/${(e.d/e.kg).toFixed(1)}/${(e.a/e.kg).toFixed(1)}<br><span class="muted">${kdaText(e.k,e.d,e.a)}</span>` : "–"}</td></tr>`).join("")}
    </table>` : `<p class="muted" style="font-size:13px">챔피언 기록이 없어요.</p>`;

  $("#detail").innerHTML = `${head}
    <div class="cards">
      <div class="card"><b>${p.games}</b><span>판수</span></div>
      <div class="card"><b>${pct(p.wr)}</b><span>승률</span></div>
      <div class="card"><b>${p.kdaGames ? kdaText(p.k,p.d,p.a) : "–"}</b><span>KDA</span></div>
      <div class="card"><b>${esc(p.streak)}</b><span>현재</span></div>
    </div>
    ${hexSection(name)}
    <h3>픽한 챔피언</h3>${champTbl}
    <h3>라인별</h3>${tbl([...p.lanes.values()].sort((a,b) => laneIdx(a.key) - laneIdx(b.key)), "라인 기록이 없어요.")}
    ${(() => {
      const A = banAnalysis();
      const sn = [...(A.snipes.get(name)?.values() || [])].sort((a,b) => b.n - a.n);
      const icons = l => `<div class="icons">${l.map(t => `<span class="bc">${champImg(t.name, 32)}<i>${t.n}</i></span>`).join("")}</div>`;
      return `<h3>상대에게 저격당한 내 챔피언</h3>${sn.length ? icons(sn) : '<p class="muted" style="font-size:13px">아직 견제받은 적 없어요.</p>'}`;
    })()}
    <h3>같은 팀일 때 (2판 이상)</h3>${tbl(duo, "아직 데이터가 부족해요.")}
    <h3>최근 경기</h3>
    <table class="mini">${p.hist.slice(0,10).map(h => `<tr><td style="width:28px"><span class="dot ${h.win?"w":"l"}">${h.win?"승":"패"}</span></td><td><div class="cn">${champImg(h.champ, 28)}<span>${esc(h.champ)} <span class="muted" style="font-weight:500">${esc(h.lane)}</span></span></div></td><td class="muted">${esc(h.date)}</td><td class="num">${h.hasKda ? `${h.k}/${h.d}/${h.a}` : ""}</td></tr>`).join("")}</table>`;
  $("#modal").hidden = false;
}

function render(){ _HX = null; _TT = null; renderMatches(); renderRank(); renderBans(); renderMembers(); renderFandom(); }

/* ---------- 이벤트 ---------- */
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["matches","rank","bans","members","fandom"].forEach(id => $("#" + id).hidden = b.dataset.tab !== id);
});
document.addEventListener("click", e => {
  if (e.target.id === "more"){ shown += 15; renderMatches(); return; }
  const p = e.target.closest("[data-p]");
  if (p && !e.target.closest("#detail")) openPlayer(p.dataset.p);
  if (e.target.classList.contains("close") || e.target.id === "modal") $("#modal").hidden = true;
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-hl]"); if (!b) return;
  b.parentNode.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".hexp").forEach(x => x.hidden = x.dataset.lane !== b.dataset.hl);
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-exp]"); if (!b) return;
  const d = b.nextElementSibling; d.hidden = !d.hidden; b.textContent = d.hidden ? "상세 기록 ▾" : "접기 ▴";
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#modal").hidden = true; });

/* ---------- 데이터 불러오기 ---------- */
async function load(){
  $("#club").textContent = CONFIG.CLUB_NAME;
  document.title = CONFIG.CLUB_NAME + " 내전 전적";
  const getCsv = async url => {
    const res = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now());
    if (!res.ok) throw new Error(res.status);
    return res.text();
  };
  const parse = t => Papa.parse(t, {header:true, skipEmptyLines:true}).data;
  const champsReady = loadChamps();
  let text = DEMO_CSV, mtext = DEMO_MEMBERS_CSV;
  if (CONFIG.SHEET_CSV_URL){
    const fails = [];
    try { text = await getCsv(CONFIG.SHEET_CSV_URL); } catch { text = ""; fails.push("전적"); }
    mtext = "";
    if (CONFIG.MEMBERS_CSV_URL){ try { mtext = await getCsv(CONFIG.MEMBERS_CSV_URL); } catch { fails.push("멤버"); } }
    if (fails.length) $("#notice").textContent = `${fails.join(", ")} 시트를 불러오지 못했어요. 주소와 '웹에 게시' 설정을 확인해 주세요.`;
  } else {
    $("#notice").textContent = "샘플 데이터로 표시 중이에요. index.html의 SHEET_CSV_URL, MEMBERS_CSV_URL에 구글 시트 주소를 넣으면 실제 기록이 보여요.";
  }
  if (mtext) loadMembers(parse(mtext));
  ALL = normalize(parse(text));
  const games = new Set(ALL.map(r => r.game)).size;
  const last = ALL.map(r => r.date).sort().pop();
  $("#updated").textContent = ALL.length ? `총 ${games}경기 · 마지막 내전 ${last}` : "기록 없음";
  render();
  await champsReady;
  if (CHAMP.ver) render();   // 썸네일 정보가 오면 다시 그리기
}
load();
</script>
